<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        /* 웹 폰트 적용 (Pretendard) */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f 0%, #000000 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .container {
            max-width: 800px;
            padding: 40px 20px;
            z-index: 10;
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #b0b0c0;
            margin-bottom: 50px;
            line-height: 1.6;
        }

        /* 카운트다운 타이머 스타일 */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            width: 100px;
            backdrop-filter: blur(10px);
        }

        .time-box span {
            display: block;
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
        }

        .time-box .label {
            font-size: 0.85rem;
            color: #888899;
            text-transform: uppercase;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* 이메일 구독 폼 스타일 */
        .subscribe-form {
            display: flex;
            justify-content: center;
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }

        .subscribe-form input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .subscribe-form input:focus {
            border-color: #4facfe;
            background: rgba(255, 255, 255, 0.1);
        }

        .subscribe-form button {
            padding: 15px 30px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .subscribe-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        /* 모바일 반응형 처리 */
        @media (max-width: 600px) {
            h1 { font-size: 2.8rem; }
            .countdown { flex-wrap: wrap; gap: 10px; }
            .time-box { width: 80px; padding: 15px; }
            .time-box span { font-size: 1.8rem; }
            .subscribe-form { flex-direction: column; }
            .subscribe-form button { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>COMING SOON</h1>
        <p class="subtitle">새로운 웹사이트를 준비 중입니다.<br>더 멋진 모습으로 곧 찾아뵙겠습니다.</p>

        <!-- 카운트다운 영역 -->
        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <div class="label">Days</div>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <div class="label">Hours</div>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <div class="label">Minutes</div>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <div class="label">Seconds</div>
            </div>
        </div>

        <!-- 알림 신청 폼 -->
        <form class="subscribe-form" onsubmit="event.preventDefault(); alert('알림 신청이 완료되었습니다!');">
            <input type="email" placeholder="이메일 주소를 입력해주세요" required>
            <button type="submit">오픈 알림받기</button>
        </form>
    </div>

    <script>
        // 오픈 예정일 설정 (현재 시간으로부터 30일 뒤로 자동 설정되도록 작성)
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 30); 

        // 특정 날짜로 지정하고 싶다면 아래 코드를 사용하세요 (예: 2026년 12월 31일)
        // const targetDate = new Date("Dec 31, 2026 00:00:00").getTime();

        const countdownInterval = setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;

            // 시간 계산 로직
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // 화면에 숫자 출력 (한 자리수일 경우 앞에 0을 붙임)
            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');

            // 카운트다운이 끝났을 때
            if (distance < 0) {
                clearInterval(countdownInterval);
                document.querySelector(".countdown").innerHTML = "<h2>오픈되었습니다!</h2>";
            }
        }, 1000);
    </script>
</body>
</html>
